<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" font-family="system-ui, -apple-system, sans-serif">
  <rect x="0" y="0" width="900" height="420" fill="#ffffff"/>

  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="700">Survey / Scorecard Interpretation Analyzer</text>
  <text x="450" y="50" text-anchor="middle" font-size="12" fill="#555">Does the scorecard's interpretation of a survey agree with the survey's own evidence?</text>

  <!-- Dimension 1 -->
  <rect x="40" y="80" width="250" height="150" rx="10" fill="#eef4ff" stroke="#2f6fed"/>
  <text x="165" y="104" text-anchor="middle" font-size="14" font-weight="700">1 · Official treatment</text>
  <text x="165" y="128" text-anchor="middle" font-size="12">Score 1–10</text>
  <text x="165" y="148" text-anchor="middle" font-size="12">9–10 → <tspan font-weight="700" fill="#1a7f37">PASS</tspan></text>
  <text x="165" y="168" text-anchor="middle" font-size="12">1–8 → <tspan font-weight="700" fill="#b42318">FAIL</tspan></text>
  <text x="165" y="192" text-anchor="middle" font-size="11" fill="#555">pure function of the score;</text>
  <text x="165" y="208" text-anchor="middle" font-size="11" fill="#555">the comment can never change it</text>

  <!-- Dimension 2 -->
  <rect x="325" y="80" width="250" height="150" rx="10" fill="#f3f0ff" stroke="#7a5af8"/>
  <text x="450" y="104" text-anchor="middle" font-size="14" font-weight="700">2 · Written evidence</text>
  <text x="450" y="128" text-anchor="middle" font-size="12">Customer comment</text>
  <text x="450" y="148" text-anchor="middle" font-size="12">sentiment + service themes</text>
  <text x="450" y="168" text-anchor="middle" font-size="12">resolution signal</text>
  <text x="450" y="192" text-anchor="middle" font-size="11" fill="#555">blank comment = no evidence,</text>
  <text x="450" y="208" text-anchor="middle" font-size="11" fill="#555">never negative evidence</text>

  <!-- Dimension 3 -->
  <rect x="610" y="80" width="250" height="150" rx="10" fill="#fff7e8" stroke="#dc6803"/>
  <text x="735" y="104" text-anchor="middle" font-size="14" font-weight="700">3 · Scorecard impact</text>
  <text x="735" y="128" text-anchor="middle" font-size="12">Branch history (chronological)</text>
  <text x="735" y="148" text-anchor="middle" font-size="12">before → after → Δ (pp)</text>
  <text x="735" y="168" text-anchor="middle" font-size="12">bonus-tier crossing?</text>
  <text x="735" y="192" text-anchor="middle" font-size="11" fill="#555">gold ≥95% · silver 90–95%</text>
  <text x="735" y="208" text-anchor="middle" font-size="11" fill="#555">one survey can cross a tier</text>

  <!-- Arrows to interpretation -->
  <line x1="165" y1="230" x2="165" y2="270" stroke="#888" stroke-width="2"/>
  <line x1="450" y1="230" x2="450" y2="270" stroke="#888" stroke-width="2"/>
  <line x1="735" y1="230" x2="735" y2="270" stroke="#888" stroke-width="2"/>
  <polygon points="160,270 170,270 165,278" fill="#888"/>
  <polygon points="445,270 455,270 450,278" fill="#888"/>
  <polygon points="730,270 740,270 735,278" fill="#888"/>

  <!-- Interpretation -->
  <rect x="180" y="280" width="540" height="90" rx="10" fill="#eef7ee" stroke="#1a7f37"/>
  <text x="450" y="304" text-anchor="middle" font-size="14" font-weight="700">Interpretation — two independent signals</text>
  <text x="450" y="328" text-anchor="middle" font-size="12"><tspan font-weight="700">conflict_flag</tspan>: written evidence disagrees with PASS/FAIL → human review</text>
  <text x="450" y="350" text-anchor="middle" font-size="12"><tspan font-weight="700">tier_crossed</tspan>: scorecard-impact event (a clean 10/10 can cross a tier)</text>

  <text x="450" y="398" text-anchor="middle" font-size="12" fill="#b42318" font-weight="600">Advisory only — never changes a score; never decides bonuses, promotions, discipline, raises, or performance ratings.</text>
</svg>
